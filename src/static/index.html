<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ActionAgent 对话界面</title>
<style>
  /* ===== 昼夜主题变量（白天默认值；JS 按太阳高度角实时插值覆盖，见 head 内主题脚本） ===== */
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f3f4f8; --surface-3: #e9ebf3;
    --border: #eceef1; --border-2: #e5e7eb;
    --text: #1f2328; --text-2: #3f4753; --text-3: #6b7280; --text-4: #9ca3af;
    --user-bubble: #eef1ff; --user-text: #1f2328;
    --code-bg: #f3f4f6; --pre-bg: #f6f8fa; --pre-border: #e6e9f0;
    --block-bg: #f9fafb; --ask-bg: #f9fafb;
    --approval-bg: #f3f4ff; --approval-border: #d9dcff; --approval-text: #3730a3;
    --selected-bg: #eef1ff; --input-ph: #b0b7c3;
    --shadow: rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); margin: 0; color: var(--text);
    transition: background-color .8s ease, color .8s ease;
  }
  /* ===== 整体布局：左会话列表 + 右对话区 ===== */
  .app { display: flex; height: 100vh; }

  /* ---- 左栏：会话列表 ---- */
  .sidebar {
    flex: 0 0 264px; min-width: 220px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-head {
    padding: 14px 14px 10px; border-bottom: 1px solid var(--border-2);
  }
  .sidebar-head h1 { font-size: 16px; margin: 0 0 10px; }
  .sidebar-head .new-chat {
    width: 100%; height: 40px; border: none; border-radius: 8px;
    background: #4d6bfe; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .sidebar-head .new-chat:hover { background: #3a56e8; }
  .sess-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sess {
    position: relative;  /* del-btn 定位锚点（S4.4 修复：无此则删除按钮跑到视口右上角） */
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    cursor: pointer; margin-bottom: 6px; background: var(--surface);
  }
  .sess:hover { background: var(--surface-3); }
  .sess.active { border-color: #4d6bfe; background: var(--selected-bg); }
  .sess .title {
    font-size: 13px; color: var(--text); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-all;
  }
  .sess .meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .sess .del-btn {
    position: absolute; top: 6px; right: 8px; display: none;
    width: 20px; height: 20px; line-height: 18px; text-align: center;
    border-radius: 50%; border: none; background: var(--surface-2); color: var(--text-3);
    font-size: 12px; cursor: pointer;
  }
  .sess:hover .del-btn { display: inline-block; }
  .sess .del-btn:hover { background: #fee2e2; color: #b91c1c; }
  .sess .del-btn.confirm { display: inline-block; width: auto; padding: 0 8px; border-radius: 8px; background: #dc2626; color: #fff; font-size: 11px; }
  .sess .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  }
  .sess .time { font-size: 11px; color: var(--text-4); margin-left: auto; }
  .sess-empty { color: var(--text-4); font-size: 12px; text-align: center; padding: 20px 0; }

  /* ---- 右栏：对话区 ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .chat-head .title { font-size: 14px; font-weight: 600; color: var(--text); }
  .chat-head .pill {
    padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .chat-head .mode-tag {
    font-size: 11px; color: var(--text-3); background: var(--surface-2);
    padding: 2px 8px; border-radius: 999px;
  }
  .chat-head .spacer { flex: 1; }
  .stop-btn {
    background: #dc2626; color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .stop-btn:hover { background: #b91c1c; }
  .stop-btn:disabled { background: var(--text-4); cursor: not-allowed; }

  .chat-flow {
    flex: 1; overflow-y: auto;
    /* 固定 900px 内容区：AI 900 贴左、用户 600 贴右、右缘重合，不随屏幕宽度变化 */
    max-width: 996px; /* 996 - 左右 padding 96 = 900px 内容区 */
    margin-left: 240px;
    padding: 20px 48px 40px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ---- 聊天区滚动条（只作用于 .chat-flow）----
     轨道 10px，滑块两侧各留 2px 透明确实边界 → 视觉可见 6px，与模型面板粗细一致。
     ⚠ 此处禁止写 scrollbar-width / scrollbar-color：标准属性一旦出现，下面整段
       ::-webkit-scrollbar 会失效（实测退回 10px 方块滑块）。Firefox 走 @supports 隔离。 */
  .chat-flow { scrollbar-gutter: stable; }  /* 常驻占位：流式输出撑出滚动条时内容不再横向跳动 */
  .chat-flow::-webkit-scrollbar { width: 10px; }
  .chat-flow::-webkit-scrollbar-track { background: transparent; }
  .chat-flow::-webkit-scrollbar-thumb {
    background-color: rgba(128,128,128,.32);
    border: 2px solid transparent;   /* 内缩：靠透明确实边界撑出 2px 呼吸，不是 padding */
    background-clip: content-box;
    border-radius: 999px;            /* 内缩会吃掉圆角（10px 宽写 3px 只剩 1px），故给超大值让它自己夹到 3px */
  }
  .chat-flow::-webkit-scrollbar-thumb:hover {
    /* 用 background-color 而非 background 简写：简写会把 background-clip 重置成 border-box，
       hover 时滑块会从 6px 突然胀成 10px */
    background-color: rgba(128,128,128,.55);
  }
  @supports not selector(::-webkit-scrollbar) {
    /* 仅 Firefox 命中；Chrome 里 selector(::-webkit-scrollbar) 为 true，此段不生效 */
    .chat-flow { scrollbar-width: thin; scrollbar-color: rgba(128,128,128,.45) transparent; }
  }

  .chat-empty {
    color: var(--text-4); font-size: 14px; text-align: center; padding: 60px 20px; line-height: 1.8;
  }

  /* ---- 对话气泡 / 过程卡（DeepSeek 风：浅底、圆润、克制） ---- */
  .msg-user {
    align-self: flex-end; max-width: 600px; margin-right: 0;
    background: var(--user-bubble); color: var(--user-text);
    border-radius: 16px 16px 4px 16px; padding: 10px 14px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  }
  .msg-agent {
    align-self: flex-start; max-width: 900px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px 4px 16px 16px;
    padding: 10px 14px; font-size: 14px; line-height: 1.7;
    word-break: break-word;
  }
  /* Agent 回答的 Markdown 渲染样式（marked.js 输出，DOMPurify 已清洗） */
  .msg-agent .md-body { font-size: 14px; line-height: 1.7; word-break: break-word; }
  .msg-agent .md-body > :first-child { margin-top: 0; }
  .msg-agent .md-body > :last-child { margin-bottom: 0; }
  .msg-agent .md-body p { margin: 0.5em 0; }
  .msg-agent .md-body h1, .msg-agent .md-body h2, .msg-agent .md-body h3, .msg-agent .md-body h4 { margin: 1em 0 0.4em; font-size: 1.08em; }
  .msg-agent .md-body strong { font-weight: 600; }
  .msg-agent .md-body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-family: Consolas, "SF Mono", monospace; font-size: 12.5px; }
  .msg-agent .md-body pre { background: var(--pre-bg); border: 1px solid var(--pre-border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .msg-agent .md-body pre code { background: none; padding: 0; }
  .msg-agent .md-body ul, .msg-agent .md-body ol { padding-left: 1.5em; margin: 0.5em 0; }
  .msg-agent .md-body li { margin: 0.2em 0; }
  .msg-agent .md-body blockquote { border-left: 3px solid var(--text-4); margin: 0.5em 0; padding: 2px 12px; color: var(--text-2); }
  .msg-agent .md-body table { border-collapse: collapse; margin: 0.5em 0; }
  .msg-agent .md-body th, .msg-agent .md-body td { border: 1px solid var(--border-2); padding: 6px 10px; }
  .msg-agent .md-body a { color: #4d6bfe; text-decoration: none; }
  .msg-agent .md-body a:hover { text-decoration: underline; }
  .msg-agent .md-body hr { border: none; border-top: 1px solid var(--border-2); margin: 1em 0; }
  .msg-agent .md-body del { color: var(--text-4); }
  .msg-agent .md-body input[type=checkbox] { margin-right: 4px; vertical-align: -2px; }
  /* 每轮过程容器（思考+工具一刀切折叠，S4.5） */
  .proc-box { align-self: flex-start; width: 92%; }
  .proc-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-3); background: var(--surface-2);
    border: 1px solid var(--pre-border); border-radius: 999px;
    padding: 3px 10px; cursor: pointer; user-select: none;
  }
  .proc-toggle:hover { background: var(--surface-3); color: var(--text-2); }
  .proc-toggle .arrow { font-size: 10px; }
  .proc-body { margin-top: 6px; }
  .block {
    align-self: flex-start; width: 92%; border-left: 3px solid var(--pre-border);
    padding: 6px 10px; background: var(--block-bg); border-radius: 4px 10px 10px 4px;
  }
  .block .tag { font-size: 12px; font-weight: 700; color: #4d6bfe; margin-bottom: 3px; }
  .block .text {
    font-size: 13px; color: var(--text-2); line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
  .block .args {
    font-size: 12px; color: var(--text-3); margin-top: 2px;
    font-family: Consolas, monospace; word-break: break-all;
  }
  .tool-ok { color: #15803d; }
  .tool-fail { color: #b91c1c; }
  .raw-btn {
    margin-top: 6px; background: var(--surface-2); border: none; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-3);
  }
  .raw-box {
    display: none; margin-top: 6px; background: #0f172a; color: #e2e8f0;
    border-radius: 6px; padding: 8px; font-size: 12px;
    font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    max-height: 200px; overflow-y: auto;
  }

  /* 审批 / 问答卡 */
  .approval-card {
    align-self: flex-start; width: 92%; background: var(--approval-bg);
    border: 1px solid var(--approval-border); border-radius: 12px; padding: 10px 12px;
  }
  .approval-card .q { font-size: 13px; color: var(--approval-text); line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
  .approval-card .row { display: flex; gap: 8px; }
  .approve-btn { background: #059669; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; cursor: pointer; }
  .approve-btn:hover { background: #047857; }
  .approve-btn:disabled { background: var(--text-4); cursor: not-allowed; }
  .deny-btn { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; cursor: pointer; }
  .deny-btn:hover { background: #b91c1c; }
  .deny-btn:disabled { background: var(--text-4); cursor: not-allowed; }
  .approval-state { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
  .ask-card {
    align-self: flex-start; width: 92%; background: var(--ask-bg);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  .ask-input {
    width: 100%; min-height: 48px; resize: vertical; padding: 8px 10px;
    border: 1px solid var(--border-2); border-radius: 10px; font-size: 13px;
    font-family: inherit; margin-top: 8px; box-sizing: border-box;
    background: var(--surface); color: var(--text);
  }
  .ask-btn { background: #059669; color: #fff; border: none; border-radius: 8px; padding: 8px 20px; font-size: 13px; cursor: pointer; }
  .ask-btn:hover { background: #047857; }
  .ask-btn:disabled { background: var(--text-4); cursor: not-allowed; }

  /* ---- 底部输入区（豆包/DeepSeek 式：圆角卡片容器 + 底部工具行） ---- */
  .chat-input {
    margin-left: 240px; max-width: 996px;   /* 与消息区对齐 */
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 12px 10px;
    border: 1px solid var(--border-2); border-radius: 16px; background: var(--surface);
    box-shadow: 0 2px 8px var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .chat-input:focus-within {
    border-color: #4d6bfe;
    box-shadow: 0 0 0 3px rgba(77,107,254,.12);
  }
  .chat-input textarea {
    flex: none; width: 100%; min-height: 30px; max-height: 240px; /* 约10行，之后出现滚动条 */
    padding: 4px 4px; border: none; outline: none; background: transparent;
    font-size: 14px; font-family: inherit; line-height: 1.6; color: var(--text);
    resize: none; overflow-y: auto;
  }
  .chat-input textarea::placeholder { color: var(--input-ph); }
  .input-bar { display: flex; align-items: center; gap: 10px; }
  /* 自定义下拉（模式选择）：向上弹出、圆角选项卡片，替代原生直角 select */
  .dropdown { position: relative; }
  .dropdown-hidden { display: none; }
  .dropdown-trigger {
    height: 30px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: 8px;
    font-size: 12px; background: var(--surface-2); color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s, background .15s;
  }
  .dropdown-trigger:hover { border-color: var(--text-4); }
  .dropdown-trigger[aria-expanded="true"] { border-color: #4d6bfe; }
  .dropdown-trigger::after {
    content: ''; width: 0; height: 0;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--text-4); transition: transform .15s;
  }
  .dropdown-trigger[aria-expanded="true"]::after { transform: rotate(180deg); }
  .dropdown-menu {
    position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 100;
    min-width: 170px; padding: 5px;
    background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px;
    box-shadow: 0 -6px 24px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
    display: none;
  }
  .dropdown-menu.open { display: block; }
  .dropdown-item {
    padding: 6px 8px; border-radius: 8px;
    display: flex; flex-direction: column; gap: 1px; cursor: pointer;
  }
  .dropdown-item:hover { background: var(--surface-3); }
  .dropdown-item.selected { background: var(--selected-bg); }
  .di-main {
    font-size: 12px; color: var(--text);
    display: flex; justify-content: space-between; align-items: center;
  }
  .dropdown-item.selected .di-main { color: #4d6bfe; font-weight: 500; }
  .dropdown-item.selected .di-main::after { content: '✓'; color: #4d6bfe; font-weight: 600; }
  .di-sub { font-size: 11px; color: var(--text-4); }
  .send-btn {
    height: 32px; padding: 0 16px;
    border: none; border-radius: 8px;
    background: #4d6bfe; color: #fff; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  .send-btn:hover { background: #3a56e8; }
  .send-btn:disabled { background: var(--text-4); cursor: not-allowed; }
  .input-hint { font-size: 11px; color: var(--text-4); }

  /* ---- toast ---- */
  #toastBox {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 9999; display: flex; flex-direction: column; gap: 8px;
    max-width: 80vw; pointer-events: none;
  }
  .toast {
    background: #111827; color: #f9fafb; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); pointer-events: auto;
    max-width: 100%; word-break: break-all;
  }
  .toast.warn { background: #92400e; }
  .toast.error { background: #b91c1c; }
  .toast.ok { background: #065f46; }
  .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  /* ---- 模型管理视图（模型切换）---- */
  .model-view { padding: 28px 24px; max-width: 760px; margin: 0 auto; height: 100vh; box-sizing: border-box; overflow-y: auto; }
  .model-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .model-head h2 { margin: 0; font-size: 17px; }
  .model-back { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .model-back:hover { background: var(--surface-3); }
  .model-current { font-size: 15px; padding: 12px 16px; background: var(--selected-bg); border: 1px solid var(--approval-border); border-radius: 10px; margin-bottom: 8px; }
  .model-current b { color: #4d6bfe; }
  .model-group { margin: 16px 0 6px; font-size: 13px; color: var(--text-3); font-weight: 600; }
  .model-row { display: inline-flex; align-items: center; margin: 4px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 16px; cursor: pointer; background: var(--surface); font-size: 13px; }
  .model-row:hover { border-color: #c7ceff; background: var(--surface-3); }
  .model-row.active { background: #4d6bfe; color: #fff; border-color: #4d6bfe; }
  .model-row.busy { opacity: .55; pointer-events: none; }
  .model-tip { font-size: 12px; color: var(--text-4); margin-top: 20px; }

  /* ---- 模型切换浮层（豆包式底部弹出；触发器在输入栏右侧） ---- */
  .ms-trigger {
    height: 32px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: 8px;
    font-size: 12px; background: var(--surface-2); color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; max-width: 220px; margin-left: auto;
    transition: border-color .15s, background .15s;
  }
  .ms-trigger:hover { border-color: var(--text-4); }
  .ms-trigger .ms-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-trigger::after {
    content: ''; width: 0; height: 0; flex: none;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--text-4);
  }
  #modelSheetMenu { min-width: 260px; max-height: 60vh; overflow-y: auto; }
  .ms-group { font-size: 11px; color: var(--text-3); padding: 10px 10px 4px; font-weight: 600; }
  .ms-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text);
  }
  .ms-item:hover { background: var(--surface-3); }
  .ms-item.active { color: #4d6bfe; font-weight: 500; }
  .ms-item .ms-check { margin-left: auto; color: #4d6bfe; font-weight: 600; flex: none; }
  .ms-config {
    border-top: 1px solid var(--border); padding: 10px; text-align: center;
    font-size: 12px; color: var(--text-3); cursor: pointer; margin: 4px -5px -5px;
  }
  .ms-config:hover { background: var(--surface-2); }
</style>
<!-- 昼夜主题（精细版）：按太阳高度角实时连续插值整套主题色，纯本地天文算法，无 API 无 CDN。
     改城市：调整下方 LAT/LON 两个常量即可。 -->
<script>
(function () {
  'use strict';
  var LAT = 29.5630, LON = 106.5516;  // 默认重庆（改城市只改这里）
  var DEG = Math.PI / 180;
  /* 白天 / 夜晚两套主题色（键名与 CSS 变量一一对应）；--bg 额外用三段（白→暖黄昏→黑） */
  var DAY = {
    'bg': '#f7f8fa', 'bg-dusk': '#f2ece2',
    'surface': '#ffffff', 'surface-2': '#f3f4f8', 'surface-3': '#e9ebf3',
    'border': '#eceef1', 'border-2': '#e5e7eb',
    'text': '#1f2328', 'text-2': '#3f4753', 'text-3': '#6b7280', 'text-4': '#9ca3af',
    'user-bubble': '#eef1ff', 'user-text': '#1f2328',
    'code-bg': '#f3f4f6', 'pre-bg': '#f6f8fa', 'pre-border': '#e6e9f0',
    'block-bg': '#f9fafb', 'ask-bg': '#f9fafb',
    'approval-bg': '#f3f4ff', 'approval-border': '#d9dcff', 'approval-text': '#3730a3',
    'selected-bg': '#eef1ff', 'input-ph': '#b0b7c3', 'shadow': 'rgba(0,0,0,.04)'
  };
  var NIGHT = {
    'bg': '#141519', 'bg-dusk': '#1a1b20',
    'surface': '#1c1d23', 'surface-2': '#27292f', 'surface-3': '#31333b',
    'border': '#2c2e36', 'border-2': '#3a3d46',
    'text': '#e6e7eb', 'text-2': '#c2c6cf', 'text-3': '#979ca6', 'text-4': '#6a6f78',
    'user-bubble': '#262b3f', 'user-text': '#e6e7eb',
    'code-bg': '#2a2c34', 'pre-bg': '#202127', 'pre-border': '#34363e',
    'block-bg': '#1e1f25', 'ask-bg': '#1e1f25',
    'approval-bg': '#272a38', 'approval-border': '#3d4160', 'approval-text': '#b3b5e0',
    'selected-bg': '#2b3050', 'input-ph': '#5c616b', 'shadow': 'rgba(0,0,0,.5)'
  };
  var TWO_PHASE = ['surface', 'surface-2', 'surface-3', 'border', 'border-2', 'text', 'text-2',
    'text-3', 'text-4', 'user-bubble', 'user-text', 'code-bg', 'pre-bg', 'pre-border',
    'block-bg', 'ask-bg', 'approval-bg', 'approval-border', 'approval-text', 'selected-bg', 'input-ph'];
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) {  // a/b 为 #hex，t∈[0,1]
    var A = hex2rgb(a), B = hex2rgb(b);
    function l(x, y) { return Math.round(x + (y - x) * t); }
    return 'rgb(' + l(A[0], B[0]) + ',' + l(A[1], B[1]) + ',' + l(A[2], B[2]) + ')';
  }
  /* 太阳高度角（度）：简化 NOAA 算法，误差几分钟内，对 UI 渐变足够 */
  function solarAltitude(d) {
    var day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
      d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()) - Date.UTC(2000, 0, 1, 12)) / 86400000;
    var g = (357.5291 + 0.98560028 * day) * DEG;
    var q = (280.459 + 0.98564736 * day) * DEG;
    var L = q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g);       // 太阳视黄经
    var dec = Math.asin(Math.sin(23.4397 * DEG) * Math.sin(L));      // 赤纬
    var utc = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
    var lst = (utc + LON / 15) % 24;                                  // 当地太阳时
    var H = ((lst - 12) * 15) * DEG;                                  // 时角
    var latR = LAT * DEG;
    return Math.asin(Math.sin(latR) * Math.sin(dec) + Math.cos(latR) * Math.cos(dec) * Math.cos(H)) / DEG;
  }
  function apply() {
    var h = solarAltitude(new Date());
    var t = (6 - h) / 12;                 // h=+6°→0 白天；h=-6°→1 夜晚
    if (t < 0) t = 0; else if (t > 1) t = 1;
    t = t * t * (3 - 2 * t);              // smoothstep：日出日落前后自然缓入缓出
    var root = document.documentElement, i, k;
    /* 背景三段插值：白 → 暖黄昏(≈t0.4) → 黑 */
    var bg;
    if (t < 0.4) bg = mix(DAY['bg'], DAY['bg-dusk'], t / 0.4);
    else if (t < 0.75) bg = mix(DAY['bg-dusk'], NIGHT['bg-dusk'], (t - 0.4) / 0.35);
    else bg = mix(NIGHT['bg-dusk'], NIGHT['bg'], (t - 0.75) / 0.25);
    root.style.setProperty('--bg', bg);
    for (i = 0; i < TWO_PHASE.length; i++) {
      k = TWO_PHASE[i];
      root.style.setProperty('--' + k, mix(DAY[k], NIGHT[k], t));
    }
    root.style.setProperty('--shadow', 'rgba(0,0,0,' + (0.04 + 0.46 * t).toFixed(3) + ')');
  }
  apply();
  setInterval(function () { if (!document.hidden) apply(); }, 30000);  // 每 30s 重算，变化渐进不跳变
})();
</script>

<body>

<!-- 模型管理视图（模型切换；独立视图，避免对话页冗余） -->

</div>

</div>

<script>
(function(){
"use strict";
/* =========================================================
 * 数据层（API / SSE / 状态）—— 与渲染层分离，换 UI 时整体复用
 * ========================================================= */
/* 权限模式（两档，豆包式）：按需确认 / 全部允许；兼容历史三档值 */
const MODE_LABELS = { 'on-demand': '🔍 按需确认', 'full-access': '⚡ 全部允许' };
const MODE_OLD_ALIAS = { 'read-only': 'on-demand', 'workspace-write': 'on-demand', 'danger-full-access': 'full-access' };
function normMode(m) {
  const n = (m && MODE_OLD_ALIAS[m]) || m || '';
  return MODE_LABELS[n] ? n : 'on-demand';
}
const api = {
  async createTask(content, sandboxMode) {
    const res = await fetch('/api/v1/task/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, sandbox_mode: sandboxMode })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || JSON.stringify(data));
    return data;
  },
  async getStatus(taskId) {
    const res = await fetch('/api/v1/task/status?task_id=' + encodeURIComponent(taskId));
    if (!res.ok) return null;
    return res.json();
  },
  async stopTask(taskId) {
    const res = await fetch('/api/v1/task/stop', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: taskId })
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  },
  async respond(taskId, answer) {
    const res = await fetch('/api/v1/task/respond', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: taskId, answer: answer })
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  },
  async listTasks() {
    const res = await fetch('/api/v1/tasks?limit=100');
    if (!res.ok) return { total: 0, tasks: [] };
    return res.json();
  },
  async continueTask(taskId, content) {
    const res = await fetch('/api/v1/task/' + encodeURIComponent(taskId) + '/continue', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  },
  async deleteTask(taskId) {
    const res = await fetch('/api/v1/tasks/' + encodeURIComponent(taskId), { method: 'DELETE' });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  },
  async listModels() {
    const res = await fetch('/api/v1/models');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || '获取模型清单失败');
    return data;
  },
  async switchModel(name) {
    const res = await fetch('/api/v1/models/switch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || '切换失败');
    return data;
  },
  async getLogs(taskId) {
    const res = await fetch('/api/v1/task/logs?task_id=' + encodeURIComponent(taskId) + '&limit=500');
    if (!res.ok) return { logs: [] };
    return res.json();
  }
};

const stream = {
  es: null,
  connect(taskId, { onEvent, onError, replay = true }) {
    this.close();
    const es = new EventSource('/api/v1/task/stream?task_id=' + encodeURIComponent(taskId) + '&replay=' + (replay ? 'true' : 'false'));
    this.es = es;
    const types = ['status','user','thought','token','tool_call','tool_result','ask','done','error','token_usage','memory_compressed'];  // 2026-09-26：+user（重放渲染用户消息）；09-30：+token_usage/memory_compressed
    for (const t of types) es.addEventListener(t, (e) => { try { onEvent(e); } catch (err) { showToast('渲染出错：' + err.message, 'error'); } });
    es.onerror = () => { if (this.es !== es) return; this.close(); onError(); };
  },
  close() { if (this.es) { this.es.close(); this.es = null; } }
};

const state = {
  curTaskId: null,   // 当前查看/执行的任务
  curTaskContent: null,
  curTaskMode: null,
  sessList: [],
  pollTimer: null,
  lastToolBlock: null,     // 最近 tool_call 块（tool_result 追加）
  lastThoughtBlock: null,  // 最近流式思考块
  lastThoughtStep: null,   // 思考去重键（旧单步号，保留兼容）
  lastThoughtKey: null,    // S4.3：turn-step 组合去重键（多轮对话区分轮次）
  isReplaying: true,        // S4.5：历史重放中（重放默认收起过程块；实时执行自动展开）
  curState: null,          // 当前会话状态（done 会话可续聊 / executing 拒并发）
  uiGen: 0                 // UI 代际：reset/openSession/runTask 时 +1，丢弃迟到的轮询/SSE 响应
};

/* =========================================================
 * 渲染层（DOM）—— 换 UI 时只重写这部分
 * ========================================================= */
const el = {
  chatFlow: document.getElementById('chatFlow'),
  chatTitle: document.getElementById('chatTitle'),
  statePill: document.getElementById('statePill'),
  modeTag: document.getElementById('modeTag'),
  stopBtn: document.getElementById('stopBtn'),
  sendBtn: document.getElementById('sendBtn'),
  taskInput: document.getElementById('taskInput'),
  modeSelect: document.getElementById('modeSelect'),
  sessList: document.getElementById('sessList'),
  modelBtn: document.getElementById('modelBtn'),
  modelView: document.getElementById('modelView'),
  modelBackBtn: document.getElementById('modelBackBtn'),
  modelCurrent: document.getElementById('modelCurrent'),
  modelList: document.getElementById('modelList'),
  modelSheetTrigger: document.getElementById('modelSheetTrigger'),
  modelSheetMenu: document.getElementById('modelSheetMenu'),
  modelDropdown: document.getElementById('modelDropdown'),
  tokenBadge: document.getElementById('tokenBadge')
};

const STATE_BADGE = {
  pending:   ['⏳ 排队中', '#f3f4f6', '#4b5563'],
  planning:  ['🧠 规划中', '#f3f4f6', '#4b5563'],
  executing: ['⚡ 执行中', '#dbe2ff', '#3a56e8'],
  waiting:   ['❓ 等待回答', '#fef9c3', '#a16207'],
  paused:    ['⏸ 已停止', '#fef9c3', '#a16207'],
  interrupted: ['⏹ 已中断', '#f1f5f9', '#64748b'],
  done:      ['✅ 完成', '#dcfce7', '#15803d'],
  failed:    ['❌ 失败', '#fee2e2', '#b91c1c'],
  '未开始':   ['未开始', '#f3f4f6', '#4b5563']
};

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* ---- token 消耗标识（累计消耗 Σ + 本轮上传 ↑，SSE token_usage 即时更新）---- */
let tokTotal = 0, tokLast = 0;
function fmtTok(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n); }
function renderTokenBadge() {
  el.tokenBadge.style.display = '';
  el.tokenBadge.textContent = 'Σ ' + fmtTok(tokTotal) + ' · ↑ ' + fmtTok(tokLast);
}
function showToast(msg, kind) {
  const box = document.getElementById('toastBox');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
/* ---- 模型管理视图（模型切换：清单下拉式、点选即时生效、校验失败回滚）---- */
async function openModelView() {
  document.querySelector('.app').style.display = 'none';
  el.modelView.style.display = '';
  await refreshModels();
}
function closeModelView() {
  el.modelView.style.display = 'none';
  document.querySelector('.app').style.display = '';
}
async function refreshModels() {
  try {
    const data = await api.listModels();
    const cur = data.current;
    el.modelCurrent.innerHTML = '当前模型：<b>' + escapeHtml(cur) + '</b>';
    el.modelList.innerHTML = '';
    for (const g of data.groups) {
      const h = document.createElement('div');
      h.className = 'model-group';
      h.textContent = g.group;
      el.modelList.appendChild(h);
      for (const m of g.models) {
        const b = document.createElement('button');
        b.className = 'model-row' + (m === cur ? ' active' : '');
        b.textContent = m;
        b.addEventListener('click', () => doSwitch(m, b));
        el.modelList.appendChild(b);
      }
    }
  } catch (err) {
    el.modelCurrent.textContent = '加载失败：' + err.message;
  }
}
async function doSwitch(name, btn) {
  if (btn.classList.contains('active') || btn.classList.contains('busy')) return;
  btn.classList.add('busy');
  const old = btn.textContent;
  btn.textContent = '校验中…';
  try {
    const r = await api.switchModel(name);
    showToast('已切换为 ' + r.current, 'ok');
    setTriggerName(r.current);
    await refreshModels();
  } catch (err) {
    showToast('切换失败：' + (err.message || '未知错误'), 'error');
    btn.textContent = old;
    btn.classList.remove('busy');
  }
}

/* ---- 模型切换浮层（底部弹出主入口） ---- */
let sheetCurrent = '';
function setTriggerName(name) {
  if (!name) return;
  sheetCurrent = name;
  el.modelSheetTrigger.querySelector('.ms-name').textContent = truncate(name, 18);
  el.modelSheetTrigger.title = name;
}
function closeAllDropdowns() {
  modeMenu.classList.remove('open');
  modeTrigger.setAttribute('aria-expanded', 'false');
  el.modelSheetMenu.classList.remove('open');
}
async function openModelSheet() {
  const willOpen = !el.modelSheetMenu.classList.contains('open');
  closeAllDropdowns();
  if (!willOpen) return;
  el.modelSheetMenu.classList.add('open');
  el.modelSheetMenu.innerHTML = '<div class="ms-group">加载中…</div>';
  try {
    const data = await api.listModels();
    setTriggerName(data.current);
    el.modelSheetMenu.innerHTML = '';
    for (const g of data.groups) {
      const h = document.createElement('div');
      h.className = 'ms-group';
      h.textContent = g.group;
      el.modelSheetMenu.appendChild(h);
      for (const m of g.models) {
        const it = document.createElement('div');
        it.className = 'ms-item' + (m === data.current ? ' active' : '');
        it.textContent = m;
        if (m === data.current) {
          const ck = document.createElement('span');
          ck.className = 'ms-check';
          ck.textContent = '✓';
          it.appendChild(ck);
        }
        it.addEventListener('click', () => pickSheetModel(m));
        el.modelSheetMenu.appendChild(it);
      }
    }
    const cfg = document.createElement('div');
    cfg.className = 'ms-config';
    cfg.textContent = '⚙ 配置自定义模型';
    cfg.addEventListener('click', () => { closeModelSheet(); openModelView(); });
    el.modelSheetMenu.appendChild(cfg);
  } catch (err) {
    el.modelSheetMenu.innerHTML = '<div class="ms-group">加载失败：' + escapeHtml(err.message) + '</div>';
  }
}
function closeModelSheet() { el.modelSheetMenu.classList.remove('open'); }
async function pickSheetModel(name) {
  if (name === sheetCurrent) { closeModelSheet(); return; }
  try {
    const r = await api.switchModel(name);
    showToast('已切换为 ' + r.current, 'ok');
    setTriggerName(r.current);
    closeModelSheet();
  } catch (err) {
    showToast('切换失败：' + (err.message || '未知错误'), 'error');
  }
}
function setPill(stateName) {
  // 兜底用中性灰，不用 failed——未知/未开始状态不应误显示为"失败"
  const b = STATE_BADGE[stateName] || ['未知', '#f3f4f6', '#4b5563'];
  el.statePill.style.background = b[1];
  el.statePill.style.color = b[2];
  el.statePill.textContent = b[0];
}
function fmtTime(iso) {
  if (!iso) return '';
  const m = String(iso).match(/T(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : iso.slice(5, 16);
}
function truncate(s, n) {
  s = String(s ?? '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

/* ---- 会话列表 ---- */
function renderSessList() {
  const box = el.sessList;
  box.innerHTML = '';
  if (!state.sessList.length) {
    box.innerHTML = '<div class="sess-empty">暂无会话</div>';
    return;
  }
  let delPending = null; // 两段式确认：第一次点变"确认？"，3s 内再点执行
  for (const t of state.sessList) {
    const b = STATE_BADGE[t.state] || ['·', '#f3f4f6', '#4b5563'];
    const div = document.createElement('div');
    div.className = 'sess' + (t.task_id === state.curTaskId ? ' active' : '');
    div.setAttribute('data-id', t.task_id);
    div.innerHTML =
      '<div class="title">' + escapeHtml(truncate(t.content, 80)) + '</div>' +
      '<div class="meta">' +
        '<span class="badge" style="background:' + b[1] + ';color:' + b[2] + ';">' + b[0] + '</span>' +
        '<span class="time">' + fmtTime(t.updated_at) + '</span>' +
      '</div>' +
      '<button class="del-btn" title="删除会话">✕</button>';
    const delBtn = div.querySelector('.del-btn');
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation(); // 不触发会话切换
      if (delPending && delPending.btn === delBtn) {
        clearTimeout(delPending.timer);
        delBtn.classList.remove('confirm');
        delBtn.textContent = '✕';
        delPending = null;
        const r = await api.deleteTask(t.task_id);
        if (!r.ok) { showToast('删除失败：' + (r.data.message || '未知错误'), 'error'); return; }
        showToast('会话已删除', 'ok');
        if (state.curTaskId === t.task_id) resetToNewChat();
        refreshSessList();
        return;
      }
      if (delPending) { delPending.btn.classList.remove('confirm'); delPending.btn.textContent = '✕'; clearTimeout(delPending.timer); }
      delBtn.classList.add('confirm');
      delBtn.textContent = '确认？';
      delPending = { btn: delBtn, timer: setTimeout(() => { delBtn.classList.remove('confirm'); delBtn.textContent = '✕'; delPending = null; }, 3000) };
    });
    box.appendChild(div);
  }
}
async function refreshSessList() {
  const r = await api.listTasks();
  state.sessList = r.tasks || [];
  renderSessList();
}
function highlightSess(id) {
  const items = el.sessList.querySelectorAll('.sess');
  for (const it of items) it.classList.toggle('active', it.getAttribute('data-id') === id);
}

/* ---- 对话区构建 ---- */
function addBlock(html, cls) {
  const div = document.createElement('div');
  div.className = 'block' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  el.chatFlow.appendChild(div);
  scrollBottom();
  return div;
}
/* ---- S4.5：每轮过程容器（思考+工具一刀切可折叠） ---- */
function ensureProcBox(turn) {
  const t = (turn !== undefined && turn !== null) ? turn : 0;
  let box = el.chatFlow.querySelector('.proc-box[data-turn="' + t + '"]');
  if (!box) {
    box = document.createElement('div');
    box.className = 'proc-box';
    box.setAttribute('data-turn', t);
    const toggle = document.createElement('div');
    toggle.className = 'proc-toggle';
    toggle.innerHTML = '<span class="arrow">▸</span> 思考过程';
    const body = document.createElement('div');
    body.className = 'proc-body';
    body.style.display = 'none';  // 默认收起：折叠后只显示最终回答
    toggle.addEventListener('click', () => {
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      toggle.querySelector('.arrow').textContent = open ? '▸' : '▾';
    });
    box.appendChild(toggle);
    box.appendChild(body);
    el.chatFlow.appendChild(box);
    scrollBottom();
  }
  return box.querySelector('.proc-body');
}
function setProcOpen(turn, open) {
  const box = el.chatFlow.querySelector('.proc-box[data-turn="' + ((turn !== undefined && turn !== null) ? turn : 0) + '"]');
  if (!box) return;
  const body = box.querySelector('.proc-body');
  const arrow = box.querySelector('.arrow');
  body.style.display = open ? 'block' : 'none';
  arrow.textContent = open ? '▾' : '▸';
}
function collapseAllProc() {
  el.chatFlow.querySelectorAll('.proc-box').forEach(box => {
    const body = box.querySelector('.proc-body');
    const arrow = box.querySelector('.arrow');
    body.style.display = 'none';
    arrow.textContent = '▸';
  });
}
function addProcBlock(html, cls, turn) {
  const body = ensureProcBox(turn);
  const div = document.createElement('div');
  div.className = 'block' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  body.appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  el.chatFlow.scrollTop = el.chatFlow.scrollHeight;
}
function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  el.chatFlow.appendChild(div);
  scrollBottom();
}
function addAgentResult(text) {
  const div = document.createElement('div');
  div.className = 'msg-agent';
  // 2026-10-04：模型输出按 Markdown 渲染（marked + DOMPurify），星号/标题/列表/代码块正常显示
  const body = document.createElement('div');
  body.className = 'md-body';
  body.innerHTML = renderMarkdown(text || '（无返回内容）');
  div.innerHTML = '<b style="color:#4d6bfe;">Agent</b>';
  div.appendChild(body);
  el.chatFlow.appendChild(div);
  scrollBottom();
}
/* 模型输出 → 安全 HTML：marked 解析（GFM：表格/删除线/任务列表）→ DOMPurify 清洗（防 XSS） */
function renderMarkdown(text) {
  if (!window.marked || !window.DOMPurify) return escapeHtml(text); // 库缺失时降级纯文本
  try {
    return DOMPurify.sanitize(marked.parse(text));
  } catch (e) {
    return escapeHtml(text);
  }
}
function addAgentError(message) {
  const div = document.createElement('div');
  div.className = 'msg-agent';
  div.innerHTML = '<b style="color:#b91c1c;">任务失败：</b>' + escapeHtml(message || '未知错误');
  el.chatFlow.appendChild(div);
  scrollBottom();
}
function emptyChat(msg) {
  el.chatFlow.innerHTML = '<div class="chat-empty">' + msg + '</div>';
}

/* ---- 工具块 + 日志面板（查看原始输出） ---- */
function addToolCall(turn, step, name, args) {
  state.lastToolBlock = addProcBlock(
    '<div class="tag">🔧 调用工具：' + escapeHtml(name) + '</div>' +
    '<div class="args">参数：' + escapeHtml(JSON.stringify(args)) + '</div>' +
    '<div class="text tool-ok">⏳ 执行中…</div>',
    '', turn
  );
  state.lastToolBlock.setAttribute('data-turn', turn);
  state.lastToolBlock.setAttribute('data-step', step);
}
function addToolResult(turn, step, d) {
  let statusHtml;
  if (d.is_denied) statusHtml = '<span class="tool-fail">⛔ 被权限拦截</span>';
  else if (d.ok) statusHtml = '<span class="tool-ok">✓ 执行成功</span>';
  else statusHtml = '<span class="tool-fail">✗ 执行失败</span>';
  let html = '<div class="tag">' + statusHtml + '</div>';
  if (d.content_summary) html += '<div class="text">' + escapeHtml(truncate(d.content_summary, 500)) + '</div>';
  html += '<button class="raw-btn">查看原始输出 ▾</button><div class="raw-box">加载中…</div>';
  const blk = (state.lastToolBlock && state.lastToolBlock.getAttribute('data-turn') == turn && state.lastToolBlock.getAttribute('data-step') == step)
    ? state.lastToolBlock : null;
  if (blk) {
    blk.innerHTML = blk.innerHTML.replace('<div class="text tool-ok">⏳ 执行中…</div>', '') + html;
    const rawBtn = blk.querySelector('.raw-btn');
    const rawBox = blk.querySelector('.raw-box');
    rawBtn.addEventListener('click', async () => {
      if (rawBox.style.display === 'block') { rawBox.style.display = 'none'; rawBtn.textContent = '查看原始输出 ▾'; return; }
      rawBox.style.display = 'block';
      rawBtn.textContent = '收起输出 ▴';
      try {
        const r = await api.getLogs(state.curTaskId);
        const hit = (r.logs || []).find((s) => s.turn_index === turn && s.step_index === step && s.tool_result);
        rawBox.textContent = hit && hit.tool_result
          ? ('exit_code: ' + (hit.tool_result.metadata && hit.tool_result.metadata.exit_code) + '\n' + (hit.tool_result.content || ''))
          : '（无原始输出）';
      } catch (e) { rawBox.textContent = '加载失败：' + e.message; }
    });
  } else {
    addProcBlock(html, '', turn);
  }
}

/* ---- 审批卡（S3.5 四态） ---- */
function addApprovalCard(question) {
  const div = document.createElement('div');
  div.className = 'approval-card';
  div.innerHTML =
    '<div class="tag" style="color:#4d6bfe;font-weight:700;">⚠️ 需要审批高危操作</div>' +
    '<div class="q">' + escapeHtml(question) + '</div>' +
    '<div class="row">' +
      '<button class="approve-btn">✓ 批准执行</button>' +
      '<button class="deny-btn">✗ 拒绝</button>' +
    '</div>';
  el.chatFlow.appendChild(div);
  scrollBottom();
  const ab = div.querySelector('.approve-btn');
  const db = div.querySelector('.deny-btn');
  const setState = (st) => {
    ab.disabled = true; db.disabled = true;
    if (st === 'approved') {
      ab.textContent = '✓ 已批准，正在执行…';
      db.style.display = 'none';
      div.insertBefore(stateBadge('approved'), div.querySelector('.row'));
    } else if (st === 'denied') {
      ab.style.display = 'none';
      db.textContent = '✗ 已拒绝，已跳过该操作';
    }
  };
  const submit = async (answer) => {
    ab.disabled = true; db.disabled = true;
    try {
      const r = await api.respond(state.curTaskId, answer);
      if (!r.ok) {
        showToast('提交失败：' + (r.data.message || '未知错误'), 'error');
        ab.disabled = false; db.disabled = false;
        return;
      }
      setState(answer === 'approve' ? 'approved' : 'denied');
      setPill('executing');
    } catch (e) {
      showToast('提交失败：' + e.message, 'error');
      ab.disabled = false; db.disabled = false;
    }
  };
  ab.addEventListener('click', () => submit('approve'));
  db.addEventListener('click', () => submit('deny'));
}
function stateBadge(st) {
  const span = document.createElement('span');
  span.className = 'approval-state';
  if (st === 'approved') { span.style.background = '#dcfce7'; span.style.color = '#15803d'; span.textContent = '✓ 已批准'; }
  else if (st === 'denied') { span.style.background = '#fee2e2'; span.style.color = '#b91c1c'; span.textContent = '✗ 已拒绝'; }
  else if (st === 'aborted') { span.style.background = '#f3f4f6'; span.style.color = '#6b7280'; span.textContent = '⏸ 任务已停止'; }
  return span;
}

/* ---- 问答卡（S3.3 clarify） ---- */
function addAskCard(question) {
  const div = document.createElement('div');
  div.className = 'ask-card';
  div.innerHTML =
    '<div class="tag" style="color:#7c3aed;">❓ Agent 需要你确认</div>' +
    '<div class="text">' + escapeHtml(question) + '</div>' +
    '<textarea class="ask-input" placeholder="输入你的回答…"></textarea>' +
    '<div style="margin-top:8px;"><button class="ask-btn">提交回答</button></div>';
  el.chatFlow.appendChild(div);
  scrollBottom();
  const input = div.querySelector('.ask-input');
  const btn = div.querySelector('.ask-btn');
  input.focus();
  const submit = async () => {
    const answer = input.value.trim();
    if (!answer) { showToast('回答不能为空', 'warn'); return; }
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const r = await api.respond(state.curTaskId, answer);
      if (!r.ok) {
        showToast('提交失败：' + (r.data.message || '未知错误'), 'error');
        btn.disabled = false; btn.textContent = '提交回答';
        return;
      }
      input.disabled = true;
      btn.textContent = '✓ 已提交，Agent 继续执行…';
      setPill('executing');
    } catch (e) {
      showToast('提交失败：' + e.message, 'error');
      btn.disabled = false; btn.textContent = '提交回答';
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); });
}

/* ---- SSE 事件 → 渲染（数据层与渲染层之间的桥） ---- */
function onEvent(ev) {
  const d = ev.data ? JSON.parse(ev.data) : {};
  switch (ev.type) {
    case 'token_usage':
      tokTotal += (d.total || 0);
      tokLast = (d.prompt || 0);
      renderTokenBadge();
      break;
    case 'memory_compressed':
      // 滚动记忆：历史某段已折叠为摘要（重放时静默，实时才提示）
      if (!state.isReplaying) showToast('记忆已压缩：第 ' + d.turns + ' 轮已折叠为摘要，上下文瘦身', 'ok');
      break;
    case 'status':
      setPill(d.state);
      if (d.state === 'paused') onFinished('stopped');
      else if (d.state === 'interrupted') onFinished('interrupted');
      else if (d.state === 'done') onFinished('done');  // 2026-09-26：重放收尾信号（回答已逐轮渲染）
      break;
    case 'user':
      // 2026-09-26：切换会话重放时渲染用户消息（此前 agent/user 不重放导致提问丢失）
      addUserMsg(d.content);
      break;
    case 'thought': {
      const key = (d.turn !== undefined ? d.turn : 0) + '-' + d.step;
      if (state.lastThoughtBlock && state.lastThoughtKey === key) {
        const t = state.lastThoughtBlock.querySelector('.text');
        if (t) t.textContent = d.text;
        state.lastThoughtKey = null;
      } else {
        state.lastThoughtBlock = addProcBlock(
          '<div class="tag">💭 思考（第 ' + (d.step + 1) + ' 步）</div>' +
          '<div class="text">' + escapeHtml(d.text) + '</div>',
          '', d.turn
        );
        state.lastThoughtKey = key;
      }
      if (!state.isReplaying) setProcOpen(d.turn, true);  // 实时执行：当前轮自动展开
      break;
    }
    case 'token': {
      const key = (d.turn !== undefined ? d.turn : 0) + '-' + d.step;
      const textEl = (state.lastThoughtBlock && state.lastThoughtKey === key)
        ? state.lastThoughtBlock.querySelector('.text') : null;
      if (textEl) {
        textEl.textContent += d.delta;
      } else {
        state.lastThoughtKey = key;
        state.lastThoughtBlock = addProcBlock(
          '<div class="tag">💭 思考（第 ' + (d.step + 1) + ' 步）</div>' +
          '<div class="text">' + escapeHtml(d.delta) + '</div>',
          '', d.turn
        );
      }
      if (!state.isReplaying) setProcOpen(d.turn, true);
      scrollBottom();
      break;
    }
    case 'tool_call':
      addToolCall(d.turn, d.step, d.name, d.arguments);
      if (!state.isReplaying) setProcOpen(d.turn, true);
      break;
    case 'tool_result':
      addToolResult(d.turn, d.step, d);
      break;
    case 'ask':
      if (d.type === 'approval') addApprovalCard(d.question);
      else addAskCard(d.question);
      break;
    case 'done':
      addAgentResult(d.result);
      if (!state.isReplaying) onFinished('done');  // 2026-09-26：重放期间只逐轮渲染，收尾由终态 status(done) 负责
      break;
    case 'error':
      addAgentError(d.message);
      onFinished('error');
      break;
  }
}

/* ---- 任务结束收尾 / 状态轮询（真相层） ---- */
function addInterruptNotice() {
  if (el.chatFlow.querySelector('.interrupt-notice')) return; // 轮询与 SSE 双触发去重
  const div = document.createElement('div');
  div.className = 'block interrupt-notice';
  div.innerHTML = '<div class="tag" style="color:#64748b;">⏹ 任务因服务重启中断</div>' +
    '<div class="text">上次执行到此为止（线程已随服务消失），完整过程已保留；如需继续可重发任务。</div>';
  el.chatFlow.appendChild(div);
  scrollBottom();
}

function onFinished(flag) {
  stopPolling();
  stream.close();
  state.isReplaying = false;
  state.lastThoughtBlock = null;   // 2026-09-26：收尾清理流式块引用，防跨轮复用（配合后端 token turn 修复）
  state.lastThoughtKey = null;
  collapseAllProc();  // S4.5：任务完成/停止 → 过程块全部收起，只留最终回答
  el.stopBtn.style.display = 'none';
  el.sendBtn.disabled = false;
  el.sendBtn.textContent = '发送';
  if (flag === 'done') { setPill('done'); state.curState = 'done'; }
  else if (flag === 'error') { setPill('failed'); state.curState = 'failed'; }
  else if (flag === 'interrupted') { addInterruptNotice(); state.curState = 'interrupted'; }
  // flag === 'stopped'：pill 保持 paused
  if (flag === 'stopped') {
    const cards = el.chatFlow.querySelectorAll('.approval-card');
    for (const c of cards) {
      const ab = c.querySelector('.approve-btn'), db = c.querySelector('.deny-btn');
      if (ab && !ab.disabled) { ab.disabled = true; ab.textContent = '⏸ 任务已停止'; if (db) db.style.display = 'none'; }
    }
  }
  refreshSessList();
}
async function syncStatus() {
  if (!state.curTaskId) return;
  const gen = state.uiGen;
  const d = await api.getStatus(state.curTaskId);
  if (gen !== state.uiGen) return; // 过期响应：期间已切换会话/新建会话，丢弃
  if (!d || !d.state) return;
  setPill(d.state);
  if (d.state === 'paused') onFinished('stopped');
  else if (d.state === 'interrupted') onFinished('interrupted');
  else if (d.state === 'done') onFinished('done');
  else if (d.state === 'failed') onFinished('error');
}
function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(syncStatus, 1500);
}
function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

/* ---- 切换会话（历史重放 + 可继续） ---- */
async function openSession(taskId, content, sandboxMode, stateName) {
  state.uiGen++;
  state.curTaskId = taskId;
  state.curTaskContent = content;
  state.curTaskMode = normMode(sandboxMode);
  state.curState = stateName || null;
  el.chatTitle.textContent = truncate(content, 40);
  el.modeTag.textContent = MODE_LABELS[state.curTaskMode] || state.curTaskMode;
  el.modeSelect.value = state.curTaskMode;
  highlightSess(taskId);
  tokTotal = 0; tokLast = 0;   // 2026-09-30：打开历史会话先清零，由重放 token_usage 重新累计
  el.tokenBadge.textContent = 'Σ 0 · ↑ 0';
  emptyChat('加载会话历史…');
  setPill('pending');
  el.sendBtn.disabled = true;
  el.stopBtn.style.display = '';
  el.stopBtn.disabled = false;
  startPolling();
  state.isReplaying = true;  // S4.5：历史重放默认收起过程块
  // 连接 stream：自动重放历史（thought/tool_call/tool_result）→ 终态或实时
  stream.connect(taskId, {
    onEvent: onEvent,
    onError: () => {
      if (state.curTaskId !== taskId) return;
      showToast('实时连接断开，已切换为状态轮询（历史不会丢）', 'warn');
      syncStatus();
    }
  });
}

/* ---- 发起任务（新会话） ---- */
async function runTask() {
  const content = el.taskInput.value.trim();
  if (!content) { showToast('请先输入任务内容', 'warn'); return; }

  // S4.3：当前会话运行中 → 拒绝并发发送（等完成/停止后再发）；输入内容保留在框内
  if (state.curTaskId && ['executing', 'planning', 'waiting'].includes(state.curState)) {
    showToast('当前会话正在执行中，请等待完成或停止后再发送', 'warn');
    return;
  }
  // S4.3：已结束的会话 → 同会话续聊（多轮对话），不新建会话
  el.taskInput.value = '';  // 发送后清空输入框（对话式交互惯例，内容已在对话流中展示）
  el.taskInput.style.height = '';  // 重置为单行高度
  if (state.curTaskId && ['done', 'failed', 'paused', 'interrupted'].includes(state.curState)) {
    return continueChat(state.curTaskId, content);
  }

  state.uiGen++;
  stream.close();
  stopPolling();
  state.isReplaying = false;  // S4.5：新任务实时执行，过程块自动展开
  el.sendBtn.disabled = true;
  el.sendBtn.textContent = '执行中…';
  const mode = el.modeSelect.value;

  // 立即在会话列表顶部插入"执行中"占位（真实 task_id 返回后替换）
  emptyChat('正在提交任务…');
  setPill('pending');
  try {
    const data = await api.createTask(content, mode);
    state.curTaskId = data.task_id;
    state.curTaskContent = content;
    state.curTaskMode = normMode(data.sandbox_mode || mode);
    state.curState = 'executing';
    el.chatTitle.textContent = truncate(content, 40);
    el.modeTag.textContent = MODE_LABELS[state.curTaskMode] || state.curTaskMode;
    el.modeSelect.value = state.curTaskMode;
    el.stopBtn.style.display = '';
    el.stopBtn.disabled = false;
    emptyChat('正在执行…');
    addUserMsg(content);
    setPill(data.state || 'pending');
    startPolling();
    stream.connect(data.task_id, {
      onEvent: onEvent,
      onError: () => {
        showToast('实时连接断开，已切换为状态轮询（界面不会卡住）', 'warn');
        syncStatus();
      }
    });
    refreshSessList();
  } catch (e) {
    setPill('failed');
    addAgentError('任务提交失败：' + e.message);
    onFinished('error');
  }
}

/* ---- S4.3：同会话续聊（多轮对话） ----
   保留已有历史 → 追加本轮 user 气泡 → replay=false 订阅实时（不重复渲染历史） */
async function continueChat(taskId, content) {
  setPill('pending');
  state.isReplaying = false;  // S4.5：续聊实时执行
  el.sendBtn.disabled = true;
  el.sendBtn.textContent = '执行中…';
  el.stopBtn.style.display = '';
  el.stopBtn.disabled = false;
  try {
    const r = await api.continueTask(taskId, content);
    if (!r.ok) throw new Error(r.data.message || ('HTTP ' + r.status));
    state.curTaskId = r.data.task_id;
    state.curTaskContent = content;
    state.curState = 'executing';
    el.chatTitle.textContent = truncate(content, 40);
    addUserMsg(content);
    startPolling();
    stream.connect(taskId, {
      onEvent: onEvent,
      onError: () => {
        showToast('实时连接断开，已切换为状态轮询（界面不会卡住）', 'warn');
        syncStatus();
      },
      replay: false,  // 2026-09-26：续聊不重放历史（历史 DOM 已在），否则第一轮思考被重复渲染
      replay: false
    });
    refreshSessList();
  } catch (e) {
    setPill('failed');
    addAgentError('续聊失败：' + e.message);
    onFinished('error');
  }
}

/* ---- 停止 ---- */
async function stopTask() {
  if (!state.curTaskId) return;
  el.stopBtn.disabled = true;
  el.stopBtn.textContent = '正在停止…';
  try {
    const r = await api.stopTask(state.curTaskId);
    if (r.ok) {
      await syncStatus();
    } else {
      await syncStatus();
      if (r.status === 409) showToast('任务已结束（' + (r.data.code || '已停止') + '），无需停止', 'warn');
      else { showToast('停止失败：' + (r.data.message || '未知错误'), 'error'); el.stopBtn.disabled = false; el.stopBtn.textContent = '■ 停止任务'; }
    }
  } catch (e) {
    showToast('停止请求失败：' + e.message, 'error');
    el.stopBtn.disabled = false;
    el.stopBtn.textContent = '■ 停止任务';
  }
}

/* ---- 事件绑定 ---- */
function resetToNewChat() {
  state.uiGen++;
  stream.close();
  stopPolling();
  state.curTaskId = null;
  state.lastToolBlock = state.lastThoughtBlock = null;
  state.lastThoughtStep = null;
  el.chatTitle.textContent = '新会话';
  setPill('未开始');
  el.modeTag.textContent = '—';
  el.modeSelect.value = 'on-demand';
  el.stopBtn.style.display = 'none';
  el.sendBtn.disabled = false;
  el.sendBtn.textContent = '发送';
  highlightSess(null);
  tokTotal = 0; tokLast = 0;
  el.tokenBadge.textContent = 'Σ 0 · ↑ 0';
  emptyChat('👋 输入任务开始对话，例如：<br>“读取 README-S1.md 并总结”<br>或 “帮我删除桌面上有关截图的图片”');
}
document.getElementById('newChatBtn').addEventListener('click', resetToNewChat);
document.getElementById('modelBtn').addEventListener('click', openModelView);
document.getElementById('modelBackBtn').addEventListener('click', closeModelView);
el.modelSheetTrigger.addEventListener('click', (e) => { e.stopPropagation(); openModelSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModelSheet(); modeMenu.classList.remove('open'); } });
el.sendBtn.addEventListener('click', runTask);
el.taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runTask(); });
/* 输入框 auto-grow（豆包式）：高度跟随内容长高，最多约10行，超出出现滚动条 */
el.taskInput.addEventListener('input', () => {
  el.taskInput.style.height = 'auto';
  el.taskInput.style.height = Math.min(el.taskInput.scrollHeight, 240) + 'px';
});
/* 自定义下拉（模式选择）：向上弹出圆角菜单，同步原生 select 值 */
const modeTrigger = document.getElementById('modeTrigger');
const modeMenu = document.getElementById('modeMenu');
const syncTrigger = () => {
  const sel = el.modeSelect;
  const opt = sel.options[sel.selectedIndex];
  modeTrigger.textContent = opt ? opt.textContent : sel.value;
  document.querySelectorAll('#modeMenu .dropdown-item').forEach((it) => {
    it.classList.toggle('selected', it.dataset.value === sel.value);
  });
};
modeTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = modeMenu.classList.toggle('open');
  modeTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
});
modeMenu.addEventListener('click', (e) => {
  const item = e.target.closest('.dropdown-item');
  if (!item) return;
  el.modeSelect.value = item.dataset.value;
  el.modeSelect.dispatchEvent(new Event('change'));
  syncTrigger();
  modeMenu.classList.remove('open');
  modeTrigger.setAttribute('aria-expanded', 'false');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#modeDropdown')) {
    modeMenu.classList.remove('open');
    modeTrigger.setAttribute('aria-expanded', 'false');
  }
  if (!e.target.closest('#modelDropdown')) closeModelSheet();
});
syncTrigger();
el.stopBtn.addEventListener('click', stopTask);
el.sessList.addEventListener('click', (e) => {
  const item = e.target.closest('.sess');
  if (!item) return;
  const id = item.getAttribute('data-id');
  const t = state.sessList.find((x) => x.task_id === id);
  if (t) openSession(t.task_id, t.content, t.sandbox_mode, t.state);
});

/* ---- 启动：加载会话列表，自动打开最近会话（豆包式体验：上次会话还在，可直接续聊） ---- */
refreshSessList();
(async () => {
  try {
    const r = await api.listTasks(1);
    const t = (r.tasks || [])[0];
    if (t) openSession(t.task_id, t.content, t.sandbox_mode, t.state);
  } catch (e) { /* 列表为空或失败时保持新会话 */ }
})();
/* 初始化模型触发器上的当前模型名 */
(async () => {
  try { const d = await api.listModels(); setTriggerName(d.current); } catch (e) { /* 保持"加载中…" */ }
})();
})();
</script>
</body>
</html>
